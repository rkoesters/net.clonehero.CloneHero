app-id: net.clonehero.CloneHero
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
separate-locales: false
build-options:
  no-debuginfo: true
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=all
  - --socket=pulseaudio
  - --persist=.clonehero
command: clonehero.sh
modules:
  - name: clonehero-linux
    buildsystem: simple
    build-commands:
       - install -Dpm0755 -t /app/bin/ apply_extra
       - install -Dpm0644 -t /app/share/applications/ net.clonehero.CloneHero.desktop
       - install -Dpm0644 -t /app/share/metainfo/ net.clonehero.CloneHero.metainfo.xml
       - install -Dpm0644 -t /app/share/icons/hicolor/128x128/apps/ net.clonehero.CloneHero.png
       - install -Dpm0755 -t /app/bin clonehero.sh
    sources:
      - type: extra-data
        filename: Linux.x86_64-Standalone.tar
        url: https://github.com/clonehero-game/releases/releases/download/v1.1.0.6142-final/Linux.x86_64-Standalone.tar
        sha1: 63350926e834b72a7ca193d46391199076f91bf3
        x-checker-data:
          type: json
          url: https://api.github.com/repos/clonehero-game/releases/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^V"; "")
          url-query: '"https://github.com/clonehero-game/releases/releases/download/V" + $tag + "/Linux.x86_64-Standalone.tar"'
      - type: file
        path: net.clonehero.CloneHero.desktop
      - type: file
        path: net.clonehero.CloneHero.metainfo.xml
      - type: file
        path: net.clonehero.CloneHero.png
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            mkdir -p /app/extra/
            tar xf Linux.x86_64-Standalone.tar -C /app/extra/
            chmod +x /app/extra/clonehero-linux/clonehero
            rm -rf Linux.x86_64-Standalone.tar
      - type: script
        dest-filename: clonehero.sh
        commands:
          - |
            exec /app/extra/clonehero-linux/clonehero $@
